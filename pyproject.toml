[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solpred"
version = "1.0.0"
description = "Similarity-aware aqueous solubility (logS) benchmark and predictor built on AqSolDB and ESOL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
solpred-predict = "solpred.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
